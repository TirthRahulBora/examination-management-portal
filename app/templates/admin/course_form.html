{% extends 'base.html' %}
{% block title %}{{ action }} Course{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card card-academic">
      <div class="card-header-academic">
        <h5 class="mb-0 fw-bold">{{ action }} Academic Course</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label for="course_code" class="form-label small fw-semibold">Course Code *</label>
            <input type="text" class="form-control" id="course_code" name="course_code" value="{{ course.course_code if course else '' }}" placeholder="e.g. CS101, DS201" required autofocus>
            <div class="form-text">Must be a unique departmental identifier.</div>
          </div>

          <div class="mb-3">
            <label for="course_name" class="form-label small fw-semibold">Course Name *</label>
            <input type="text" class="form-control" id="course_name" name="course_name" value="{{ course.course_name if course else '' }}" placeholder="e.g. Data Structures and Algorithms" required>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label small fw-semibold">Course Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" placeholder="Overview of topics and evaluation objectives...">{{ course.description if course else '' }}</textarea>
          </div>

          <div class="mb-4">
            <label for="status" class="form-label small fw-semibold">Course Status</label>
            <select class="form-select" id="status" name="status">
              <option value="Active" {% if not course or course.status == 'Active' %}selected{% endif %}>Active</option>
              <option value="Inactive" {% if course and course.status == 'Inactive' %}selected{% endif %}>Inactive</option>
            </select>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('admin.courses') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">{{ action }} Course</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
