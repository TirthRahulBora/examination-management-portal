{% extends 'base.html' %}
{% block title %}403 Forbidden{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-danger mb-3">403</div>
    <h2 class="fw-bold mb-3">Access Forbidden</h2>
    <p class="text-muted mb-4">You do not have permission to view or execute actions on this resource. Ensure you are logged in with the appropriate role privileges.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4"><i class="bi bi-house-door me-2"></i>Return to Portal</a>
  </div>
</div>
{% endblock %}
