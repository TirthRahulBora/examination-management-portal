{% extends 'base.html' %}
{% block title %}500 Internal Error{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h2 class="fw-bold mb-3">Internal Server Error</h2>
    <p class="text-muted mb-4">An unexpected application error occurred. Any active database transaction has been safely rolled back.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4"><i class="bi bi-house-door me-2"></i>Return to Portal</a>
  </div>
</div>
{% endblock %}
