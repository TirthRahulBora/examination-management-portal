{% extends 'base.html' %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-secondary mb-3">404</div>
    <h2 class="fw-bold mb-3">Resource Not Found</h2>
    <p class="text-muted mb-4">The examination, booking, course, or route you requested could not be located on the portal.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4"><i class="bi bi-house-door me-2"></i>Return to Portal</a>
  </div>
</div>
{% endblock %}
