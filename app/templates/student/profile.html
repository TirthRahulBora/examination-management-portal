{% extends 'base.html' %}
{% block title %}My Student Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card card-academic mb-4">
      <div class="card-header-academic">
        <h5 class="mb-0 fw-bold"><i class="bi bi-person-circle text-primary me-2"></i>My Student Profile</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Institutional Email (Read Only)</label>
            <input type="email" class="form-control bg-light" value="{{ current_user.email }}" readonly disabled>
          </div>

          <div class="mb-3">
            <label for="full_name" class="form-label small fw-semibold">Full Name *</label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label for="department" class="form-label small fw-semibold">Academic Department</label>
              <input type="text" class="form-control" id="department" name="department" value="{{ current_user.department or '' }}" placeholder="e.g. Data Science">
            </div>
            <div class="col-md-6">
              <label for="contact_number" class="form-label small fw-semibold">Contact Number</label>
              <input type="tel" class="form-control" id="contact_number" name="contact_number" value="{{ current_user.contact_number or '' }}" placeholder="+91-98765-43210">
            </div>
          </div>

          <hr class="my-4">
          <h6 class="fw-bold text-dark mb-1"><i class="bi bi-shield-lock me-1"></i> Change Account Password</h6>
          <div class="small text-muted mb-3">Leave blank if you do not wish to update your password.</div>

          <div class="mb-3">
            <label for="new_password" class="form-label small fw-semibold">New Password (min 6 characters)</label>
            <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" placeholder="••••••••">
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label small fw-semibold">Confirm New Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" placeholder="••••••••">
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
