{% extends 'base.html' %}
{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card card-academic shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-person-plus-fill fs-3"></i>
          </div>
          <h4 class="fw-bold mb-1">Student Registration</h4>
          <p class="text-muted small">Create your student examination account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register_student') }}">
          <div class="mb-3">
            <label for="full_name" class="form-label small fw-semibold">Full Name *</label>
            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Aarav Sharma" required autofocus>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label small fw-semibold">Email Address *</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="student@emp.edu" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="department" class="form-label small fw-semibold">Department</label>
              <input type="text" class="form-control" id="department" name="department" placeholder="Computer Science">
            </div>
            <div class="col-md-6 mb-3">
              <label for="contact_number" class="form-label small fw-semibold">Contact Number</label>
              <input type="tel" class="form-control" id="contact_number" name="contact_number" placeholder="+91-98765-43210">
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-semibold">Password (min 6 characters) *</label>
            <input type="password" class="form-control" id="password" name="password" minlength="6" required>
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label small fw-semibold">Confirm Password *</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
            <i class="bi bi-check-lg me-1"></i> Register Student Account
          </button>
        </form>

        <div class="border-top pt-3 text-center">
          <span class="small text-muted">Already registered? </span>
          <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary">Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
